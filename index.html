<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinTrack — Personal Finance</title>
    <meta
      name="description"
      content="Private, offline-first personal finance tracker: budgets, goals, loans, cash flow and smart insights in ₹."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint so dark-mode users never see a light flash.
      (function () {
        var theme = 'light';
        try {
          var pref = localStorage.getItem('fintrack-theme') || 'light';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (pref === 'dark' || (pref === 'system' && systemDark)) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b1020' : '#f5f7fb');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
